version: "3.8"

services:
  backend:
    build: ./backend
    container_name: aisist-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      # ดึงค่าจากไฟล์ .env
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - app-network
    restart: always

  frontend:
    build: ./AISist
    container_name: aisist-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      # สำหรับ Client (Browser) ยิง API ไปที่ Backend
      - NUXT_PUBLIC_API_BASE=http://localhost:3001
      # สำหรับ Server (Nuxt SSR) ใน Docker ยิง API ไปที่ Backend
      - NUXT_API_BASE=http://backend:3001
      # ดึงค่าจากไฟล์ .env ทั้งหมด
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NUXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NUXT_PUBLIC_SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./AISist:/app
      - /app/node_modules
      - /app/.nuxt
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge